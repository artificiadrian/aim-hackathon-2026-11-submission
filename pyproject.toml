[project]
name = "mcnulty"
version = "0.1.0"
description = "Team-10 harness for Harness Arena"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
